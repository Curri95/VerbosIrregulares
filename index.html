        <div class="progress">
            <div id="barraProgreso" class="progress-bar bg-warning" role="progressbar" style="width: 0%;"
                aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>

            </div>

            </div>

        <br>
        <div class="row">
            <button id="botonComprobar" type="button" class="btn btn-block btn-primary"
                onclick="comprobar(columna),guardarCookies(nivelCookies, marcadorCookies)">Comprobar</button>
                
        </div>

        <br>
        <div class="row">
            <div class="col-4"></div>
            <div class="col-4">
                <button type="button" class="btn btn-block btn-primary" onclick="cambiarNivel()">Cambia de nivel</button>

        </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="js/listaVerbos.js"></script>
    <script>
        var nivel;
        var nivel02 = "";
        var columna = "";
        var columna02 = "";
        var iconos = ""
        var cuadradoicono = "";
        var marcador = 0;
        var jugando = 0;
        var id = 0;
        var alternativa = "";
        var auxiliar = [];
        var chequeDobleVerbo = 0;
        var nivelCookies = "nivel" + nivel;
        var marcadorCookies;
        width = 0; 
        style = "";
        
        let arrayAuxiliar = [["was", "were"], ["learnt", "learnd"]];

        document.getElementById("oculto").style.display = "none";
    
        function elegirVerbos(nivel02) {        
            nivel = nivel02;           
            verCookies(nivel);     
            document.getElementById("visible").style.display = "none";
            document.getElementById("oculto").style.display = "inherit";
            Estrellitas(nivel);
            dameNivel(nivel);
            eligeVerbo();
            comprobar(columna);
            nivelCookies02 = "nivel" + nivel;
        }

        function dameNivel(nivel) {
            document.getElementById('miNivel').innerHTML = 'Nivel: ' + nivel;
        }
        
       
        function Estrellitas(nivel02) {            
                for (var i = 0; i < 10; i++) {
                    iconos = iconos + '<i class="far fa-star" id="' + i + '" style=""></i>';
                    document.getElementById('adondevanlosiconos').innerHTML = iconos;
                }          
        }
        
        function borraColorIconos(auxiliar) {
            for (auxiliar = id + 1; auxiliar >= 0; auxiliar--) {
                document.getElementById(auxiliar).style.color = 'white';
            }
            id = 0;
        }
     
        function comprobar(columna) {
            if (jugando == 0) {
                jugando = 1;
                var columna02 = document.getElementById('miform').value;
                if (columna02 == columna) {
                    chequeDobleVerbo = 0;
                    document.getElementById('botonComprobar').classList.remove('btn-primary');
                    document.getElementById('botonComprobar').classList.add('btn-success');
                    document.getElementById('botonComprobar').innerText = "Correct! Don't get Cocky.";
                    marcador++;                
                    auxiliar = id; 
                    marcadorCookies = marcador;              
                } 
                else {
                    document.getElementById('botonComprobar').classList.add('btn-danger');
                    document.getElementById('botonComprobar').innerText = columna;
                    marcador = 0;               
                    borraColorIconos();
                }
            }
            else {
                document.getElementById('botonComprobar').classList.remove('btn-success');
                document.getElementById('botonComprobar').classList.remove('btn-danger');
                document.getElementById('botonComprobar').classList.add('btn-primary');
                document.getElementById('botonComprobar').innerText = "Comprobar";
                jugando = 0;
                marcadorCookies = marcador;
                eligeVerbo(nivel);
            }
            document.getElementById('marcador').innerText = marcador;
        }

        comprobar(columna);

        function eligeVerbo() {
            var verboelegido = Math.floor(Math.random() * nivel);
            var tiempoRandom = Math.floor(Math.random() * 3);
            document.getElementById('spanishVerb').innerHTML = verbos[verboelegido][3]; 
            if (verbos[verboelegido][3] == 'ser' || verbos[verboelegido][3] == 'aprender') {           
                chequeDobleVerbo = 1;
            }
            if (tiempoRandom == 0) {
                document.getElementById('forma01').innerHTML = '<input id="miform" class="form-control form-sl cajatexto" type="text" placeholder="Dime verbo" > ';
                columna = verbos[verboelegido][0];
            } 
            else {
                document.getElementById('forma01').innerHTML =
                    '<button type="button" class="btn btn-block btn-primary" id="forma01">' + verbos[verboelegido][0] + '</button>';
            }
            if (tiempoRandom == 1) {
                document.getElementById('forma02').innerHTML = '<input id="miform" class="form-control form-sl cajatexto" type="text" placeholder="Dime verbo"> ';
                columna = verbos[verboelegido][1];
            } 
            else {
                document.getElementById('forma02').innerHTML =
                    '<button type="button" class="btn btn-block btn-primary" id="forma02">' + verbos[verboelegido][1] + '</button>';
            }
            if (tiempoRandom == 2) {
                document.getElementById('forma03').innerHTML = '<input id="miform" class="form-control form-sl cajatexto" type="text" placeholder="Dime verbo"> ';
                columna = verbos[verboelegido][2];
            } 
            else {
                document.getElementById('forma03').innerHTML =
                    '<button type="button" class="btn btn-block btn-primary" id="forma03">' + verbos[verboelegido][2] + '</button>';
            }
        }
        
        function cambiarNivel() {
            location.reload();
        }

        

        function barraProgresso() {
            var element = document.getElementById('barraProgreso');
            progress = setInterval(function () {

                element.style.width = 100 * (marcador / nivel) + '%';

            }, 250);
        }

        function guardarCookies(nivelCookies02,marcadorCookies){
            nombreUsuario= nivelCookies;
            puntuacion= marcadorCookies;
            fecha= "31 Diciembre 2023 23:59:59 GTM";
            document.cookie= nombreUsuario + "=" + puntuacion + "expira = " + fecha;
        }
        
        function verCookies (nivel){
            lasCookies = document.cookie;
            cookieCompleta = lasCookies.split('=');
            for (i in cookieCompleta){
                var arrayAuxiliar = cookieCompleta[i].split('=');
                var nivelActual = arrayAuxiliar[0].substring(5);
                var marcadorActual = arrayAuxiliar[1];
                if(nivel==nivelActual){
                    marcador= marcadorActual;
                }
            }
        }
        guardarCookies(nivelCookies,marcadorCookies);
        function cambiaNivel() {
            location.reload();
        }


        barraProgresso();

    </script>
